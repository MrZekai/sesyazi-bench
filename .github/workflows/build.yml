name: Build benchmark APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (native -O3, debug imzalı)
        env:
          # Hızlı mod anahtarları (Settings → Secrets → Actions → WIT_TOKENS)
          WIT_TOKENS: ${{ secrets.WIT_TOKENS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/SesYaziBench-${GITHUB_RUN_NUMBER}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: SesYaziBench-apk-${{ github.run_number }}
          path: out/*.apk
          retention-days: 30
