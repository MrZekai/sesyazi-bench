name: Build benchmark APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: WIT_TOKENS doğrula (içerik yazdırılmaz)
        env:
          WIT_TOKENS: ${{ secrets.WIT_TOKENS }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          known = set("tr en de fr es it pt ru ar hi id".split())
          raw = os.environ.get("WIT_TOKENS", "")
          try:
              v = json.loads(raw)
          except ValueError:
              sys.exit("WIT_TOKENS geçerli JSON değil")
          if not isinstance(v, dict) or not v:
              sys.exit("WIT_TOKENS boş ya da nesne değil")
          bad = [k for k, t in v.items() if k not in known or not isinstance(t, str) or not t.strip() or any(c.isspace() for c in t)]
          if bad:
              sys.exit("WIT_TOKENS hatalı girdi: " + ", ".join(sorted(bad)))
          missing = sorted(known - set(v))
          print("WIT_TOKENS tamam: %d dil" % len(v) + (" (eksik: " + ", ".join(missing) + ")" if missing else ""))
          PY

      - name: Birim testleri (Wit ayrıştırıcı, ses dönüştürme, okuma birimleri)
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Yükleme anahtarı (zorunlu)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            printf '%s' "$UPLOAD_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Yükleme anahtarıyla imzalanacak"
          else
            # Play'e gidecek paket debug imzalı çıkmasın: açık hatayla dur
            echo "HATA: UPLOAD_KEYSTORE_B64 secret'ı yok. Play'e yüklenebilir paket üretilemez."; exit 1
          fi
          for v in UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "HATA: $v secret'ı yok."; exit 1; }
          done

      - name: Build release APK + AAB
        env:
          # Hızlı mod anahtarları (Settings → Secrets → Actions → WIT_TOKENS)
          WIT_TOKENS: ${{ secrets.WIT_TOKENS }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          # Gerçek reklam kimlikleri (yoksa test kimlikleri kullanılır)
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
          ADMOB_TEST_DEVICE_IDS: ${{ secrets.ADMOB_TEST_DEVICE_IDS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      # Yayın kapısı: APK sağlam mı, her .so 16 KB LOAD hizalı mı, APK ZIP 16 KB hizalı mı.
      # Herhangi biri başarısızsa derleme DURUR (uyarıyla geçmez).
      - name: 16 KB kapısı (ELF + ZIP hizalama)
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          unzip -tq "$APK"
          libs=$(unzip -Z1 "$APK" | grep -E '^lib/.+\.so$' || true)
          bad=0
          if [ -z "$libs" ]; then
            echo "APK'da native kütüphane yok"
          else
            rm -rf so && mkdir so
            unzip -o -q "$APK" 'lib/*' -d so
            while IFS= read -r f; do
              aligns=$(readelf -lW "so/$f" 2>/dev/null | awk '$1=="LOAD"{print $NF}' || true)
              [ -n "$aligns" ] || { echo "::error::okunamadı: $f"; bad=1; continue; }
              ok=1; for a in $aligns; do [ $((a)) -ge 16384 ] || ok=0; done
              if [ $ok -eq 1 ]; then echo "tamam: $f"
            else
              case "$f" in
                # 16 KB sayfa yalnız 64 bit cihazlarda var (Google gereksinimi arm64-v8a / x86_64);
                # 32 bit kütüphaneler 4 KB sayfalı cihazlarda çalışır → bilgi, kapı değil
                lib/armeabi-v7a/*|lib/x86/*) echo "bilgi (32 bit, gereksinim dışı): $f" ;;
                *) echo "::error::16 KB hizalı değil: $f"; bad=1 ;;
              esac
            fi
            done <<< "$libs"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          echo "build-tools: $BT"   # -P 16 için 35+ gerekir
          ZA="${BT}zipalign"
          "$ZA" -c -P 16 -v 4 "$APK" > zipalign.log || { tail -20 zipalign.log; echo "::error::APK ZIP 16 KB hizalı değil"; bad=1; }
          test "$bad" -eq 0

      - name: AAB imza denetimi (debug imzası olmamalı)
        run: |
          owner=$(keytool -J-Duser.language=en -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -m1 'Owner:' || true)
          echo "$owner"
          [ -n "$owner" ] || { echo "HATA: AAB imzası okunamadı"; exit 1; }
          if echo "$owner" | grep -q 'Android Debug'; then echo "HATA: AAB debug anahtarıyla imzalı"; exit 1; fi
          # Sertifika parmak izi logda: Play Console → Uygulama bütünlüğü → Yükleme anahtarı ile karşılaştır
          keytool -J-Duser.language=en -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -m1 'SHA256:' 

      - name: Rename outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/app-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/app-${GITHUB_RUN_NUMBER}.aab"
          # Kaynak ↔ çıktı bağı (kabul testlerinde bu dosya esas alınır)
          { echo "commit: ${GITHUB_SHA}"; echo "run: ${GITHUB_RUN_NUMBER}"; (cd out && sha256sum app-*.apk app-*.aab); } > out/BUILD-INFO.txt
          cat out/BUILD-INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.run_number }}
          path: out/*
          retention-days: 30
