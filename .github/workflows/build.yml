name: Build benchmark APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: WIT_TOKENS doğrula (içerik yazdırılmaz)
        env:
          WIT_TOKENS: ${{ secrets.WIT_TOKENS }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          known = set("tr en de fr es it pt ru ar hi id".split())
          raw = os.environ.get("WIT_TOKENS", "")
          try:
              v = json.loads(raw)
          except ValueError:
              sys.exit("WIT_TOKENS geçerli JSON değil")
          if not isinstance(v, dict) or not v:
              sys.exit("WIT_TOKENS boş ya da nesne değil")
          bad = [k for k, t in v.items() if k not in known or not isinstance(t, str) or not t.strip() or any(c.isspace() for c in t)]
          if bad:
              sys.exit("WIT_TOKENS hatalı girdi: " + ", ".join(sorted(bad)))
          missing = sorted(known - set(v))
          print("WIT_TOKENS tamam: %d dil" % len(v) + (" (eksik: " + ", ".join(missing) + ")" if missing else ""))
          PY

      - name: Birim testleri (Wit ayrıştırıcı, ses dönüştürme, okuma birimleri)
        run: |
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: Yükleme anahtarı (zorunlu)
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
        run: |
          if [ -n "$UPLOAD_KEYSTORE_B64" ]; then
            printf '%s' "$UPLOAD_KEYSTORE_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "UPLOAD_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "Yükleme anahtarıyla imzalanacak"
          else
            # Play'e gidecek paket debug imzalı çıkmasın: açık hatayla dur
            echo "HATA: UPLOAD_KEYSTORE_B64 secret'ı yok. Play'e yüklenebilir paket üretilemez."; exit 1
          fi
          for v in UPLOAD_STORE_PASSWORD UPLOAD_KEY_ALIAS UPLOAD_KEY_PASSWORD; do
            [ -n "${!v}" ] || { echo "HATA: $v secret'ı yok."; exit 1; }
          done

      - name: Build release APK + AAB
        env:
          # Hızlı mod anahtarları (Settings → Secrets → Actions → WIT_TOKENS)
          WIT_TOKENS: ${{ secrets.WIT_TOKENS }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_ALIAS: ${{ secrets.UPLOAD_KEY_ALIAS }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.UPLOAD_KEY_PASSWORD }}
          # Gerçek reklam kimlikleri (yoksa test kimlikleri kullanılır)
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_BANNER_ID: ${{ secrets.ADMOB_BANNER_ID }}
          ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
          ADMOB_NATIVE_ID: ${{ secrets.ADMOB_NATIVE_ID }}
          ADMOB_TEST_DEVICE_IDS: ${{ secrets.ADMOB_TEST_DEVICE_IDS }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      # Yayına uygun çıktı YALNIZ denetimler geçerse yüklenir
      - name: 16 KB hizalama denetimi (APK içindeki her .so)
        run: |
          mkdir -p so && unzip -o -q app/build/outputs/apk/release/app-release.apk 'lib/*' -d so
          files=$(find so/lib -name '*.so')
          count=$(echo "$files" | grep -c '\.so$' || true)
          [ "$count" -gt 0 ] || { echo "HATA: APK'da .so bulunamadı"; exit 1; }
          bad=0
          for f in $files; do
            out=$(readelf -lW "$f") || { echo "HATA: readelf okuyamadı: $f"; bad=1; continue; }
            aligns=$(echo "$out" | awk '$1=="LOAD"{print $NF}')
            [ -n "$aligns" ] || { echo "HATA: LOAD segmenti yok: $f"; bad=1; continue; }
            ok=1
            for align in $aligns; do [ $((align)) -ge 16384 ] || ok=0; done
            if [ $ok -eq 1 ]; then echo "tamam: $(basename $f)"; else echo "UYUMSUZ: $(basename $f)"; bad=1; fi
          done
          echo "$count .so denetlendi"
          [ $bad -eq 0 ] || { echo "16 KB hizalama başarısız"; exit 1; }

      - name: AAB imza denetimi (debug imzası olmamalı)
        run: |
          owner=$(keytool -J-Duser.language=en -printcert -jarfile app/build/outputs/bundle/release/app-release.aab | grep -m1 'Owner:' || true)
          echo "$owner"
          [ -n "$owner" ] || { echo "HATA: AAB imzası okunamadı"; exit 1; }
          if echo "$owner" | grep -q 'Android Debug'; then echo "HATA: AAB debug anahtarıyla imzalı"; exit 1; fi

      - name: Rename outputs
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/MuteRead-${GITHUB_RUN_NUMBER}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/MuteRead-${GITHUB_RUN_NUMBER}.aab"

      - uses: actions/upload-artifact@v4
        with:
          name: MuteRead-${{ github.run_number }}
          path: out/*
          retention-days: 30
